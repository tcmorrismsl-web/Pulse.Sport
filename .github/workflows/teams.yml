name: Refresh team lists

on:
  schedule:
    - cron: "17 9 * * 1"        # Mondays, early morning
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/teams.yml"
      - "scripts/fetch_teams.py"

permissions:
  contents: write

jobs:
  teams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch team lists from ESPN
        run: python scripts/fetch_teams.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teams
          git diff --cached --quiet || (git commit -m "Refresh team lists" && git push)
